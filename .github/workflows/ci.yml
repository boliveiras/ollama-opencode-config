name: CI

# Este workflow responde "funciona?". As verificacoes de seguranca (SAST,
# SCA, segredos, assinatura) ficam em security.yml.
#
# Actions fixadas por SHA de commit: tag e ponteiro mutavel e estas rodam
# com o token do repositorio. O Dependabot mantem os SHAs atualizados.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pester (${{ matrix.shell }})
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # powershell = Windows PowerShell 5.1 | pwsh = PowerShell 7+
        # A matriz existe porque bug real ja apareceu so no 5.1: stderr de
        # processo externo virando erro terminante matava o 'ollama pull'.
        shell: [powershell, pwsh]
    defaults:
      run:
        # O contexto matrix so e permitido aqui; em 'steps[*].shell' o
        # GitHub rejeita a expressao.
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Instalar Pester
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -RequiredVersion 5.7.1

      - name: Rodar testes
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = "testresults-${{ matrix.shell }}.xml"
          Invoke-Pester -Configuration $config

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testresults-${{ matrix.shell }}
          path: testresults-${{ matrix.shell }}.xml
          if-no-files-found: ignore

  remote:
    name: Execucao remota simulada (${{ matrix.shell }})
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CI: 'true'   # pula a confirmacao interativa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Via iex, como o usuario final faria
        run: |
          # Le do disco em vez da rede, mas exercita o mesmo caminho: sem
          # arquivo de script, sem variavel de script, escopo global.
          # O runner nao tem GPU nem necessariamente winget, entao a assercao
          # e sobre ter chegado a decidir o modelo, nao sobre o
          # provisionamento completo.
          $saida = ((Get-Content -Raw ./install.ps1) | Invoke-Expression) *>&1 | Out-String
          Write-Host $saida
          if ($saida -notmatch 'Configuracao escolhida') {
            throw 'O script nao chegou a decidir modelo e contexto no modo iex'
          }
          if ($saida -match 'The attribute cannot be added') {
            throw 'Regressao: atributo de validacao no param() quebra o modo iex'
          }

      - name: Via scriptblock com parametros
        run: |
          $ErrorActionPreference = 'Stop'
          $sb = [scriptblock]::Create((Get-Content -Raw ./install.ps1))
          & $sb -ShowPlanOnly
          if ($LASTEXITCODE -ne 0) { throw "scriptblock terminou com $LASTEXITCODE" }

      - name: A sessao continua utilizavel depois do iex
        run: |
          $antes = $ErrorActionPreference
          (Get-Content -Raw ./install.ps1) | Invoke-Expression
          if ($ErrorActionPreference -ne $antes) {
            throw "O script vazou ErrorActionPreference: '$antes' virou '$ErrorActionPreference'"
          }
          Write-Host 'Preferencias restauradas corretamente.'

  encoding:
    name: Encoding e integridade do blob
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: ASCII puro, sem BOM
        run: |
          set -euo pipefail
          falhou=0
          while IFS= read -r -d '' f; do
            if LC_ALL=C grep -qP '[^\x00-\x7F]' "$f"; then
              echo "::error file=$f::contem byte fora de ASCII"
              falhou=1
            fi
            if head -c 3 "$f" | grep -q $'\xef\xbb\xbf'; then
              echo "::error file=$f::comeca com BOM"
              falhou=1
            fi
          done < <(find . -path ./.git -prune -o -name '*.ps1' -print0)
          [ "$falhou" -eq 0 ] && echo "Tudo ASCII puro, sem BOM."
          exit "$falhou"

      - name: O blob e igual ao arquivo (sem conversao de EOL)
        run: |
          set -euo pipefail
          # O install.ps1 e servido cru pelo raw e executado com 'irm | iex':
          # o usuario recebe o BLOB. Se o Git normalizar as quebras de linha,
          # o blob passa a diferir do arquivo testado e do hash publicado.
          # '-text' no .gitattributes evita isso; aqui garantimos que continua.
          falhou=0
          while IFS= read -r f; do
            eol=$(git ls-files --eol -- "$f" | awk '{print $1, $2}')
            if [ "$eol" != "i/crlf w/crlf" ]; then
              echo "::error file=$f::EOL inesperado ($eol). Esperado 'i/crlf w/crlf'."
              falhou=1
              continue
            fi
            if ! cmp -s <(git cat-file blob "HEAD:$f") "$f"; then
              echo "::error file=$f::o blob difere do arquivo em disco"
              falhou=1
            fi
          done < <(git ls-files '*.ps1')
          [ "$falhou" -eq 0 ] && echo "Blob identico ao arquivo em todos os .ps1."
          exit "$falhou"
